name: Contribution preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ab6e5325937bf73f478710db9c0760ea37c5ab35
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install '.[dev]'
      - run: python -m flake8 . --select=E9,F63,F7,F82
      - run: python -m mypy socid_extractor/
      - run: python -m pytest --ignore=tests/test_e2e.py -q
      - run: python -m pytest tests/test_e2e.py -k lemmy -q
